{% comment %}
Reusable pagination bar. Preserves the current request query string.
{% endcomment %}

{% if is_paginated %}
  <nav class="pagination" aria-label="Paginação">
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    <div class="flex gap-2">
      {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" class="pagination-page" rel="prev">Anterior</a>
      {% endif %}
      {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" class="pagination-page" rel="next">Próxima</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
