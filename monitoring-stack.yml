version: "3.9"

# Stack Swarm opcional e independente da aplicação. Todo valor específico do
# ambiente vem do .env; o docker-stack.yml de produção não é usado nem alterado.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_data:/prometheus
      - ${MONITORING_CONFIG_DIR}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_CONFIG_DIR}/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    networks:
      - monitoring
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 256M

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ${MONITORING_CONFIG_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_CONFIG_DIR}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  # MCP oficial do Grafana. Não possui login próprio: o Traefik mantém TLS e
  # Basic Auth sempre anexados ao router. Se as variáveis ficarem vazias, o
  # endpoint falha fechado/inoperante sem impedir os demais serviços da stack.
  grafana-mcp:
    image: grafana/mcp-grafana:1.0.0
    command:
      - "-t"
      - "streamable-http"
      - "--address"
      - "0.0.0.0:8000"
      - "--endpoint-path"
      - "/mcp"
      - "--allowed-hosts"
      - "${MCP_DOMAIN}"
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    networks:
      - monitoring
      - traefik_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana-mcp.rule=Host(`${MCP_DOMAIN}`)"
        - "traefik.http.routers.grafana-mcp.entrypoints=websecure"
        - "traefik.http.routers.grafana-mcp.tls=true"
        - "traefik.http.routers.grafana-mcp.tls.certresolver=letsencrypt"
        - "traefik.http.routers.grafana-mcp.middlewares=grafana-mcp-auth"
        - "traefik.http.middlewares.grafana-mcp-auth.basicauth.users=${MCP_BASICAUTH_USERS}"
        - "traefik.http.services.grafana-mcp.loadbalancer.server.port=8000"
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  loki:
    image: grafana/loki:3.3.2
    command:
      - "-config.file=/etc/loki/loki-config.yml"
      - "-config.expand-env=true"
    environment:
      - LOKI_RETENTION=${LOKI_RETENTION:-360h}
    volumes:
      - loki_data:/loki
      - ${MONITORING_CONFIG_DIR}/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - monitoring
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MONITORING_CONFIG_DIR}/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    networks:
      - monitoring
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "0.15"
          memory: 64M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  monitoring:
    external: true
  traefik_public:
    external: true
