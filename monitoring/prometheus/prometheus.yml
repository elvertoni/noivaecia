global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: "noivaecia"

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    dns_sd_configs:
      - names: ["tasks.node-exporter"]
        type: A
        port: 9100

  - job_name: "cadvisor"
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080

  # Único alvo específico do projeto: ao reutilizar, troque apenas o nome da
  # stack/serviço e a porta abaixo. tasks.* descobre todas as réplicas do app.
  - job_name: "django"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names: ["tasks.noivaecia_app"]
        type: A
        port: 8000

  # Traefik (OPT-IN): exige habilitar métricas no docker-stack.yml da aplicação
  # e redeployar a produção; por isso este scrape permanece comentado.
  # - job_name: "traefik"
  #   static_configs:
  #     - targets: ["noivaecia_traefik:8080"]
